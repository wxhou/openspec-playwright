# Playwright E2E Test Credentials
# Customize these for your application.
#
# Setup:
#   1. Export test credentials as environment variables:
#        export E2E_USERNAME=your-email@example.com
#        export E2E_PASSWORD=your-password
#        export E2E_AUTH_REQUIRED=true
#   2. For multi-user tests, add one entry per role; the E2E workflow
#      reads these entries and generates one setup per role. Each setup reads
#      E2E_<ROLE>_USERNAME / E2E_<ROLE>_PASSWORD: <ROLE> is the entry name
#      uppercased, and non-alphanumeric characters become "_" (admin → E2E_ADMIN_*).
#   3. Run: npx playwright test --project=setup
#   4. Keep this file out of commits — init/update ignore it via the managed
#      .gitignore block unless you opted out.
#
# API login (preferred): set E2E_AUTH_API to your login endpoint
#   auth.setup.ts calls POST {E2E_AUTH_API} with username + password.
#   Example: export E2E_AUTH_API=/api/auth/login   (default when unset)
#
# UI login (fallback): set E2E_AUTH_METHOD=ui
#   auth.setup.ts opens the browser and fills the login form.
#   Make sure selectors in auth.setup.ts match your login page.

users:
  - name: user
    username: CHANGE_ME@example.com
    password: CHANGE_ME_PASSWORD

  # Multi-user example (uncomment and configure for role-based tests):
  # - name: admin
  #   username: CHANGE_ME@admin.com
  #   password: CHANGE_ME_ADMIN_PASSWORD
  # - name: premium
  #   username: CHANGE_ME@premium.com
  #   password: CHANGE_ME_PREMIUM_PASSWORD

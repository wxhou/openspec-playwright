# OpenSpec + Playwright — autonomous pipeline
# Generated by `openspec-pw init --auto-pipeline`. Edit freely; the generator
# never overwrites an existing file.
#
# Two triggers, two jobs, on purpose:
#   * every pull request runs `gate` only  -> this is the check you mark as
#     required in branch protection. Without that setting a red PR can still be
#     merged, and "a human reviews the PR" stops being a real gate.
#   * a label or a manual dispatch runs the agent -> expensive, so it never
#     starts on its own.
#
# Required repository secrets:
#   ANTHROPIC_API_KEY   - for the headless Claude Code runs
# Everything is referenced as ${{ secrets.* }}; no credential lives in this file.

name: OpenSpec Auto Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      change:
        description: "OpenSpec change name (e.g. add-search)"
        required: true
        type: string
      branch:
        description: "Branch that already contains the change"
        required: true
        type: string
      e2e:
        description: "Generate E2E tests from the change scenarios"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openspec-auto-${{ github.event.pull_request.number || inputs.change }}
  cancel-in-progress: false

env:
  # A `claude -p` run otherwise waits up to 10 minutes for background work the
  # agent started (a dev server, for instance) and then throws it away.
  CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
  # Pinned deliberately: `--bare` is slated to become the default for `-p`, and
  # bare mode does not load `.claude/commands/`, which would silently disable
  # `/opsx:apply`. The preflight step below fails if the pin ever drifts.
  CLAUDE_CODE_VERSION: "2.1.310"

jobs:
  # ── Gate only: cheap, deterministic, safe to require ────────────────────
  gate:
    name: gate
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm install -g @fission-ai/openspec@latest openspec-playwright@latest

      # No change name here: a PR job must never fail because two changes are
      # open at once. These four checks do not need one; the agent job runs the
      # full gate (validate + e2e included) before it opens the PR.
      - name: Gate
        run: openspec-pw gate --only lint,typecheck,test,flake --keep-going

  # ── Agent: label or manual dispatch only ────────────────────────────────
  agent:
    name: agent
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'openspec:auto' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install CLIs
        run: |
          npm install -g @fission-ai/openspec@latest
          npm install -g openspec-playwright@latest
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing repository secret ANTHROPIC_API_KEY"; exit 1
          fi
          claude --version | grep -q "$CLAUDE_CODE_VERSION" || {
            echo "::error::Claude Code version drifted from the pin; re-test the pipeline before unpinning"; exit 1; }
          # `.claude/` sits in the init-managed gitignore block, so the command
          # files are never in git — regenerate them here before asserting.
          # `openspec update` is not enough: it only refreshes tools already
          # configured in the global config, which a fresh runner does not have.
          # The `core` profile omits `/opsx:verify`, which stage 5 runs.
          openspec init --tools claude --profile custom --no-animation >/dev/null
          test -f .claude/commands/opsx/apply.md || {
            echo "::error::/opsx:apply was not produced by 'openspec init --tools claude' — check the OpenSpec CLI version"; exit 1; }

      - name: Resolve change
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGE="${{ inputs.change }}"
          if [ -z "$CHANGE" ] && [ -n "${{ github.event.pull_request.number }}" ]; then
            CHANGE=$(gh pr view ${{ github.event.pull_request.number }} --json body \
              --jq '.body' | grep -oE 'openspec change:[[:space:]]*[A-Za-z0-9_-]+' | head -1 | sed 's/.*:[[:space:]]*//')
          fi
          if [ -z "$CHANGE" ]; then
            echo "::error::No change name. Pass the workflow input, or put 'openspec change: <name>' in the PR body."; exit 1
          fi
          echo "change=$CHANGE" >> "$GITHUB_OUTPUT"

      # The prompt carries the self-verification loop: the agent is told to run
      # the gate and revise until it is green. The explicit gate step below is
      # the independent second opinion — either one alone leaves a hole.
      - name: Apply change
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANGE: ${{ steps.resolve.outputs.change }}
        run: |
          claude -p "/opsx:apply $CHANGE. Run \`openspec-pw gate $CHANGE\` and revise until it exits 0." \
            --permission-mode acceptEdits \
            --permission-prompts none \
            --tools "Bash,Read,Edit,Write" \
            --allowedTools "Read" "Edit" "Write" "Bash(npm *)" "Bash(npx *)" "Bash(git *)" "Bash(gh *)" \
            --max-turns 60 \
            --max-budget-usd 8 \
            --output-format json > apply.json || true

      - name: Check task completion
        env:
          CHANGE: ${{ steps.resolve.outputs.change }}
        run: |
          total=$(openspec list --json | jq -r --arg c "$CHANGE" '.changes[] | select(.name==$c) | .totalTasks')
          done=$(openspec list --json | jq -r --arg c "$CHANGE" '.changes[] | select(.name==$c) | .completedTasks')
          echo "Tasks: ${done:-?}/${total:-?}"
          if [ -z "$total" ] || [ "$total" -eq 0 ] || [ "$done" != "$total" ]; then
            echo "::error::Apply did not finish: ${done:-0}/${total:-0} tasks complete (a headless run that stops to ask questions still exits 0)"
            exit 1
          fi

      - name: Generate E2E tests
        if: ${{ inputs.e2e != false }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANGE: ${{ steps.resolve.outputs.change }}
        run: |
          claude -p "/opsx:e2e $CHANGE --auto" \
            --permission-mode acceptEdits \
            --permission-prompts none \
            --tools "Bash,Read,Edit,Write" \
            --allowedTools "Read" "Edit" "Write" "Bash(npm *)" "Bash(npx *)" "Bash(git *)" \
            --max-turns 60 \
            --max-budget-usd 10 \
            --output-format json > e2e.json || true
          openspec-pw coverage "$CHANGE" --plan "tests/playwright/changes/$CHANGE/test-plan.md"

      - name: Gate
        env:
          CHANGE: ${{ steps.resolve.outputs.change }}
        run: openspec-pw gate "$CHANGE" --json --keep-going | tee gate.json

      # Advisory only: checks the implementation against the change artifacts and
      # records the report in the PR. It never decides whether the PR opens.
      - name: Verify (advisory)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANGE: ${{ steps.resolve.outputs.change }}
        run: |
          claude -p "/opsx:verify $CHANGE" \
            --permission-mode acceptEdits \
            --permission-prompts none \
            --tools "Bash,Read" \
            --allowedTools "Read" "Bash" \
            --max-turns 30 \
            --max-budget-usd 5 \
            --output-format json > verify.json || true
          jq -r '.result // empty' verify.json > verify.md 2>/dev/null || echo "verify did not run" > verify.md

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE: ${{ steps.resolve.outputs.change }}
        run: |
          BRANCH="openspec-auto/$CHANGE"
          git config user.name "openspec-pw"
          git config user.email "openspec-pw@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "feat(openspec): apply $CHANGE" || echo "Nothing to commit"
          git push -u origin "$BRANCH"
          cost() { jq -r '.total_cost_usd // 0' "$1" 2>/dev/null || echo 0; }
          {
            printf 'openspec change: %s\n\n' "$CHANGE"
            printf 'Gate: `%s`\n\n' "$(jq -r .verdict gate.json 2>/dev/null || echo unknown)"
            jq -r '.checks[] | "- `\(.name)`: \(.status)"' gate.json 2>/dev/null || true
            printf '\nCosts: apply $%s · e2e $%s · verify $%s\n\n' \
              "$(cost apply.json)" "$(cost e2e.json)" "$(cost verify.json)"
            printf '### Verify (advisory)\n\n%s\n' "$(cat verify.md)"
          } > pr-body.md
          NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$NUMBER" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" --title "openspec: $CHANGE" --body-file pr-body.md
          else
            gh pr edit "$NUMBER" --body-file pr-body.md
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openspec-auto-${{ github.run_id }}
          path: |
            gate.json
            apply.json
            e2e.json
            verify.json
            verify.md
            pr-body.md
            openspec/reports/
            test-results/
          retention-days: 14
